<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warehouse Management System</title>
    <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="assets/vendor/icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
    <div class="brand"><i class="bi bi-boxes fs-4"></i><span>WMS Console</span></div>
    <nav id="menu" class="nav flex-column pb-4"></nav>
</aside>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="main">
    <header class="topbar d-flex align-items-center gap-3">
        <button class="btn btn-light d-lg-none" id="sidebarToggle" aria-label="Menu"><i class="bi bi-list fs-5"></i></button>
        <div class="fw-semibold fs-5 flex-grow-1 text-truncate" id="topTitle">Dashboard</div>
        <div class="dropdown">
            <button class="btn btn-light position-relative" data-bs-toggle="dropdown" aria-label="Alerts">
                <i class="bi bi-bell fs-5"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" id="alertCount">0</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow" id="alertMenu" style="min-width: 260px"></ul>
        </div>
        <div class="dropdown">
            <button class="btn btn-light d-flex align-items-center gap-2" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle fs-5"></i>
                <span class="d-none d-md-inline" id="userName"></span>
                <span class="badge text-bg-primary d-none d-md-inline" id="userRole"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><button class="dropdown-item" id="changePwBtn"><i class="bi bi-key me-2"></i>Change password</button></li>
                <li><hr class="dropdown-divider"></li>
                <li><button class="dropdown-item text-danger" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button></li>
            </ul>
        </div>
    </header>
    <main class="content" id="view"></main>
</div>
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 2000" id="toasts"></div>

<script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/jsbarcode/JsBarcode.all.min.js"></script>
<script src="assets/vendor/html5-qrcode/html5-qrcode.min.js"></script>
<script src="assets/vendor/chartjs/chart.umd.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/pages/dashboard.js"></script>
<script src="assets/js/pages/catalog.js"></script>
<script src="assets/js/pages/partners.js"></script>
<script src="assets/js/pages/documents.js"></script>
<script src="assets/js/pages/purchases.js"></script>
<script src="assets/js/pages/sales.js"></script>
<script src="assets/js/pages/transfers.js"></script>
<script src="assets/js/pages/inventory.js"></script>
<script src="assets/js/pages/reports.js"></script>
<script src="assets/js/pages/admin.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
