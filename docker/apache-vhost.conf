<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <DirectoryMatch "^/var/www/html/(\.git|docker)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^(\.gitignore|\.dockerignore|\.vercelignore|Dockerfile|render\.yaml|vercel\.json|run\.bat|README\.md)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
